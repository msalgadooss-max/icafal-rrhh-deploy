<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corregir documento - ICAFAL</title>
<link rel="icon" href="../assets/img/logo-icafal-mark.png">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-md mx-auto px-4 py-8">
    <div class="text-center mb-6">
      <img src="../assets/img/logo-icafal.png" alt="ICAFAL Ingeniería y Construcción" class="h-16 mx-auto mb-4">
      <h1 class="text-2xl font-bold text-gray-900">Corregir documento</h1>
      <p class="text-gray-500 text-sm mt-1">Revisamos tu postulación y necesitamos que corrijas lo siguiente.</p>
    </div>

    <div id="alerta"></div>
    <div id="cargando" class="text-center text-gray-400 text-sm py-10">Cargando...</div>
    <form id="form-subsanar" class="hidden bg-white shadow-sm rounded-xl p-5 space-y-5"></form>
    <div id="resultado" class="hidden bg-white shadow-sm rounded-xl p-6 text-center space-y-3"></div>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/subsanar.js"></script>
</body>
</html>

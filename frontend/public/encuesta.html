<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encuesta del proceso - ICAFAL</title>
<link rel="icon" href="../assets/img/logo-icafal-mark.png">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-lg mx-auto px-4 py-8">
    <img src="../assets/img/logo-icafal.png" alt="ICAFAL Ingeniería y Construcción" class="h-14 mx-auto mb-4">
    <h1 class="text-2xl font-bold text-gray-900 text-center mb-1">¿Cómo te fue con el proceso?</h1>
    <p class="text-gray-500 text-sm text-center mb-6">Tu opinión nos ayuda a mejorarlo. Es anónima y toma menos de 2 minutos.</p>

    <form id="form-encuesta" class="space-y-4">
      <div id="preguntas" class="space-y-4"></div>

      <div class="bg-white shadow-sm rounded-xl p-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">¿Algo que deberíamos mejorar? <span class="text-gray-400 font-normal">(opcional)</span></label>
        <textarea id="comentario" rows="3" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
      </div>

      <div class="bg-white shadow-sm rounded-xl p-4 grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Tu nombre <span class="text-gray-400 font-normal">(opcional)</span></label>
          <input id="nombre" type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Cargo que probaste <span class="text-gray-400 font-normal">(opcional)</span></label>
          <input id="cargo_probado" type="text" placeholder="Ej: Jornal Concretero" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
      </div>

      <div id="alerta"></div>

      <button type="submit" id="btn-enviar"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg py-3 transition">
        Enviar respuestas
      </button>
    </form>

    <div id="resultado" class="hidden bg-green-50 border border-green-200 rounded-xl p-8 text-center">
      <div class="text-green-600 text-4xl">✔</div>
      <h2 class="text-lg font-bold text-gray-900 mt-2">¡Gracias por tu tiempo!</h2>
      <p class="text-sm text-gray-600 mt-1">Tu respuesta nos ayuda a mejorar el proceso.</p>
    </div>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/encuesta.js"></script>
</body>
</html>

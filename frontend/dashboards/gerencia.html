<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Gerencia - ICAFAL</title>
<link rel="icon" href="../assets/img/logo-icafal-mark.png">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <header class="bg-white border-b px-6 py-4 flex justify-between items-center">
    <div class="flex items-center gap-4">
      <img src="../assets/img/logo-icafal.png" alt="ICAFAL" class="h-9">
      <div>
        <h1 class="font-bold text-gray-900">Panel de Gerencia</h1>
        <p class="text-xs text-gray-500">Vista global de todo el proceso · Solo lectura</p>
      </div>
    </div>
    <div class="flex items-center gap-4">
      <span class="text-sm text-gray-600" data-usuario-nombre></span>
      <button onclick="cerrarSesion()" class="text-sm text-red-600 font-medium">Cerrar sesión</button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-6">
    <div id="alerta"></div>
    <div id="estado-vivo"></div>

    <div id="estado-sistema" class="flex flex-wrap gap-2 mb-6"></div>

    <!-- KPIs por etapa -->
    <div id="kpis" class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-9 gap-3 mb-6"></div>

    <!-- Cupos por cargo -->
    <div class="bg-white rounded-xl shadow-sm p-4 mb-6">
      <h2 class="text-sm font-semibold text-gray-700 mb-3">Dotación por cargo</h2>
      <div id="cupos" class="grid grid-cols-2 sm:grid-cols-4 gap-3"></div>
    </div>

    <!-- v5: Bitácora de actividad en lenguaje natural -->
    <div class="bg-white rounded-xl shadow-sm p-4 mb-6">
      <h2 class="text-sm font-semibold text-gray-700 mb-3">Actividad reciente</h2>
      <ul id="lista-bitacora" class="space-y-2 max-h-72 overflow-y-auto"></ul>
      <p id="bitacora-vacio" class="text-center text-gray-400 text-sm py-6 hidden">Todavía no hay actividad registrada.</p>
    </div>

    <!-- Filtro -->
    <div class="flex flex-wrap items-end gap-3 mb-3">
      <div>
        <label class="text-sm text-gray-600 block mb-1">Filtrar por estado:</label>
        <select id="filtro-estado" class="border border-gray-300 rounded-lg px-3 py-1.5 text-sm">
          <option value="">Todos</option>
          <option value="En_banco">En banco</option>
          <option value="Pendiente">Pendiente</option>
          <option value="Pre_aprobado_terreno">Pre-aprobado terreno</option>
          <option value="Aprobado_admin">Aprobado admin</option>
          <option value="Datos_completados">Datos completados</option>
          <option value="Induccion_ok">Inducción OK</option>
          <option value="EPP_listo">EPP listo</option>
          <option value="Contratado">Contratado</option>
          <option value="Proceso_completo">Proceso completo</option>
          <option value="Rechazado">Rechazado</option>
        </select>
      </div>
      <span id="contador" class="text-xs text-gray-400 mb-2"></span>

      <!-- v10.10: descarga en Excel, filtrando por rango de fecha de postulación -->
      <div class="ml-auto flex flex-wrap items-end gap-3">
        <div><label class="block text-xs text-gray-600 mb-1">Desde</label>
          <input type="datetime-local" id="desde-gerencia" class="border border-gray-300 rounded-lg px-2 py-1.5 text-sm"></div>
        <div><label class="block text-xs text-gray-600 mb-1">Hasta</label>
          <input type="datetime-local" id="hasta-gerencia" class="border border-gray-300 rounded-lg px-2 py-1.5 text-sm"></div>
        <button class="bg-gray-900 hover:bg-gray-800 text-white text-xs font-semibold px-3 py-2 rounded-lg" onclick="exportarGerenciaExcel()">Descargar Excel</button>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow-sm overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 text-gray-500 text-left">
          <tr>
            <th class="px-4 py-3">RUT</th>
            <th class="px-4 py-3">Nombre</th>
            <th class="px-4 py-3">Cargo</th>
            <th class="px-4 py-3">Comuna</th>
            <th class="px-4 py-3">Estado</th>
            <th class="px-4 py-3">Última actualización</th>
          </tr>
        </thead>
        <tbody id="tbody-postulaciones"></tbody>
      </table>
      <p id="vacio" class="text-center text-gray-400 text-sm py-10 hidden">No hay postulaciones registradas.</p>
    </div>
  </main>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/dashboard-common.js"></script>
  <script src="../assets/js/estado-vivo.js"></script>
  <script src="../assets/js/dashboard-gerencia.js"></script>
</body>
</html>

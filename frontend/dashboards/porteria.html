<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portería - ICAFAL</title>
<link rel="icon" href="../assets/img/logo-icafal-mark.png">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <header class="bg-white border-b px-6 py-4 flex justify-between items-center">
    <div class="flex items-center gap-4">
      <img src="../assets/img/logo-icafal.png" alt="ICAFAL" class="h-9">
      <div>
        <h1 class="font-bold text-gray-900">Portería</h1>
        <p class="text-xs text-gray-500">Verificación de credencial de acceso</p>
      </div>
    </div>
    <div class="flex items-center gap-4">
      <span class="text-sm text-gray-600" data-usuario-nombre></span>
      <button onclick="cerrarSesion()" class="text-sm text-red-600 font-medium">Cerrar sesión</button>
    </div>
  </header>

  <main class="max-w-md mx-auto p-6">
    <div id="alerta"></div>

    <div class="bg-white shadow-sm rounded-xl p-5 space-y-4">
      <p class="text-sm text-gray-600">
        Escanea el QR desde el celular de la persona, o escribe manualmente
        su RUT (u otro documento) y el código de seguimiento que aparece en
        su pantalla.
      </p>
      <form id="form-consulta" class="space-y-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">RUT / documento</label>
          <input id="rut" type="text" required placeholder="12345678-9"
                 class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-base focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Código de seguimiento</label>
          <input id="codigo" type="text" required maxlength="10" placeholder="AB12CD"
                 class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-base uppercase focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
        <button type="submit" id="btn-consultar"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg py-3 text-base transition">
          Verificar
        </button>
      </form>
    </div>

    <div id="resultado" class="mt-5"></div>
    <div id="ingreso-faena" class="mt-3"></div>
  </main>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/dashboard-common.js"></script>
  <script src="../assets/js/dashboard-porteria.js"></script>
</body>
</html>
